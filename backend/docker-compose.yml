version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: biblioteca_mysql
    restart: always
    environment:
      MYSQL_DATABASE: biblioteca_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db-dump:/docker-entrypoint-initdb.d
    networks:
      - biblioteca-net

  backend:
    build: .
    container_name: biblioteca_backend
    restart: always
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DB_URI: jdbc:mysql://db:3306/biblioteca_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: root
      DB_PASSWORD: root
      DB_DRIVER: com.mysql.cj.jdbc.Driver
    depends_on:
      - db
    networks:
      - biblioteca-net

networks:
  biblioteca-net:
    driver: bridge

volumes:
  mysql_data: